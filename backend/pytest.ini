[pytest]
testpaths = tests
python_files = test_*.py

# 让 `app` 包可导入。显式写出来是因为 `pytest` 与 `python -m pytest` 的行为不同：
# 后者会把 cwd 加进 sys.path，前者不会。只靠调用方式碰巧能跑，
# 换个人换台机器就 ModuleNotFoundError。
pythonpath = .

# 开发机上 ROS 2 的 site-packages 会经由 PYTHONPATH 混进来，pytest 自动加载它的
# pytest11 插件后崩在 `ModuleNotFoundError: No module named 'lark'`——
# 与本项目毫无关系，但会让 `pytest` 直接跑不起来。
#
# 这里按名字禁用它们。**禁用一个不存在的插件名是无害的**（已验证），
# 所以这份配置在学校服务器（没有 ROS）上会静默变成空操作，不需要分环境维护。
addopts = -p no:launch_ros -p no:launch_testing -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint

filterwarnings =
    error::DeprecationWarning:app.*
